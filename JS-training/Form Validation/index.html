<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <title> Form Validation</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container">
        <form>
            <i class="fa-solid fa-paper-plane"></i>
            <div class="Input-group">
                <label for="name">Full Name</label>
                <input type="text" placeholder="Enter your name" id="contact-name" onkeyup="validateName()">
                <span id="name-error"></span>
            </div>
            <div class="Input-group">
                <label for="number">Phone no.</label>
                <input type="text" placeholder="123 456 789" id="contact-phone" onkeyup="validatePhone()">
                <span id="phone-error"></span>
            </div>
            <div class="Input-group">
                <label for="email">Email Id</label>
                <input type="text"  placeholder="Enter Email" id="contact-email" onkeyup="validateEmail()">
                <span id="email-error"> </span>
            </div>
            <div class="Input-group">
                <label for="msg">Your Message </label>
                <textarea name="text" rows="5" placeholder="Enter your massage" id="contact-msg" onkeyup="validateMessage()"></textarea>
                <span id="msg-error"></span>
            </div>
            <button onclick="return validateForm()">Submit</button>
            <span id="submit-error"></span>
        </form>
    </div>

    <script src="./main.js"></script>
</body>
</html>
